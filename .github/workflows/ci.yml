name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build peer
        if: runner.os != 'Windows'
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/hostmesh-mcp" ./cmd/hostmesh-mcp
      - name: Test with the native executable
        if: runner.os != 'Windows'
        run: HOST_STATUS_TEST_BINARY="$RUNNER_TEMP/hostmesh-mcp" go test -count=1 ./...
      - name: Build and test Windows x64 peer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CGO_ENABLED = '0'
          $env:HOST_STATUS_TEST_BINARY = "$env:RUNNER_TEMP/hostmesh-mcp.exe"
          go build -trimpath -o $env:HOST_STATUS_TEST_BINARY ./cmd/hostmesh-mcp
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go test -count=1 ./...
      - name: Test Windows monitoring as a standard user
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-user.ps1
      - name: Upload tested Windows executable
        if: runner.os == 'Windows' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hostmesh-mcp-windows-amd64
          path: ${{ runner.temp }}/hostmesh-mcp.exe
          if-no-files-found: error
