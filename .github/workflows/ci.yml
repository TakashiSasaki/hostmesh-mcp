name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Build peer
        run: CGO_ENABLED=0 go build -o "$RUNNER_TEMP/host-status-mcp" ./cmd/host-status-mcp
      - name: Test with the native executable
        run: HOST_STATUS_TEST_BINARY="$RUNNER_TEMP/host-status-mcp" go test -count=1 ./...
