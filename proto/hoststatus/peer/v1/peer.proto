syntax = "proto3";
package hoststatus.peer.v1;
option go_package = "github.com/TakashiSasaki/host-status-mcp/proto/hoststatus/peer/v1;peerv1";

service Peering {
  rpc Link(stream Frame) returns (stream Frame);
}

message Frame {
  oneof body {
    Hello hello = 1;
    Heartbeat heartbeat = 2;
    StatusRequest status_request = 3;
    StatusResponse status_response = 4;
    Cancel cancel = 5;
    Inventory inventory = 6;
    RecordRequest record_request = 7;
    Records records = 8;
    Reachability reachability = 9;
    RenewalStream renewal = 10;
  }
}

message Hello {
  uint32 version = 1;
  string link_id = 2;
  NodeRecord node = 3;
  repeated string sections = 4;
}

message NodeRecord {
  string id = 1;
  string hostname = 2;
  string os = 3;
  repeated string addresses = 4;
  repeated string endpoints = 5;
  bool relay = 6;
  uint64 revision = 7;
  repeated bytes cert_chain = 8;
  bytes signature = 9;
}

message Heartbeat {}

message StatusRequest {
  string id = 1;
  string target_id = 2;
  repeated string sections = 3;
  uint32 timeout_ms = 4;
  // Set by the single relay, using the identity of its incoming link.
  string origin_id = 5;
}

message StatusResponse {
  string id = 1;
  // JSON uses the same result fields and units as the host_status MCP tool.
  bytes result_json = 2;
  string error_code = 3;
  string error_message = 4;
  map<string, string> section_errors = 5;
}

message Cancel {
  string id = 1;
}

message RecordVersion {
  string id = 1;
  uint64 revision = 2;
  bytes hash = 3;
}

message Inventory {
  repeated RecordVersion versions = 1;
}

message RecordRequest {
  repeated string ids = 1;
}

message Records {
  repeated NodeRecord nodes = 1;
}

message Reachability {
  repeated string connected_ids = 1;
  // Ordered mTLS peers from the advertising relay to its fixed CA gateway.
  repeated string renewal_path = 2;
}

// Multiplex a bounded end-to-end CA TLS exchange over existing Link streams.
message RenewalStream {
  string id = 1;
  oneof action {
    RenewalOpen open = 2;
    bytes data = 3;
    bool close = 4;
  }
}

message RenewalOpen {
  repeated string path = 1;
}
